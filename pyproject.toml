[project]
name = "conf-chat"
version = "0.1.0"
description = "Conf-Chat: a p2p chat system built on the OpenDHT distributed hash table"
authors = [
    { name = "Caden Greenhalgh", email = "caden@greenhalgh.work" }
]
requires-python = ">=3.13"
dependencies = [
    "opendht>=4.4.99",
]

[project.scripts]
conf-chat = "conf_chat.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
